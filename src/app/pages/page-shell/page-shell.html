<section class="section">
  <div class="container page-shell__head" appReveal>
    @if (eyebrow()) {
      <app-eyebrow [label]="eyebrow()!" [index]="meta()?.index ?? ''" />
    }
    <h1 class="h1 page-shell__title">
      {{ h1parts().before }}@if (h1parts().em) {<em>{{ h1parts().em }}</em>}{{ h1parts().after }}
    </h1>
    @if (lead()) {
      <p class="lead page-shell__lead">{{ lead() }}</p>
    }
  </div>
</section>
