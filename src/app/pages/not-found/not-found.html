<section class="section">
  <div class="container not-found">
    <span class="display not-found__code">404</span>
    <h1 class="h1">{{ 'Página no encontrada' | t }}</h1>
    <p class="lead">{{ 'La página que buscas no existe o fue movida.' | t }}</p>
    <div class="not-found__links">
      <app-button variant="secondary" [routerLink]="homePath()">{{ 'Volver al inicio' | t }}</app-button>
      <app-button variant="ghost" [routerLink]="proyectosPath()">{{ 'Proyectos' | t }}</app-button>
      <app-button variant="ghost" [routerLink]="contactoPath()">{{ 'Contacto' | t }}</app-button>
    </div>
  </div>
</section>
