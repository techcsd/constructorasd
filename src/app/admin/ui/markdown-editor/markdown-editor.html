<div class="md">
  <div class="md__bar">
    <div class="md__modes">
      <button type="button" [class.is-active]="mode()==='edit'" (click)="mode.set('edit')">Editar</button>
      <button type="button" [class.is-active]="mode()==='split'" (click)="mode.set('split')">Dividido</button>
      <button type="button" [class.is-active]="mode()==='preview'" (click)="mode.set('preview')">Vista</button>
    </div>
    <span class="md__count small">{{ words() }} palabras · {{ chars() }} car.</span>
  </div>
  <div class="md__panes" [attr.data-mode]="mode()">
    @if (mode()!=='preview') {
      <textarea class="md__ta" spellcheck="false" [value]="value()"
        (input)="onInput($any($event.target).value)" (keydown)="onKeydown($event)"
        placeholder="Escribe en markdown…"></textarea>
    }
    @if (mode()!=='edit') {
      <div #preview class="md__preview" [innerHTML]="html()"></div>
    }
  </div>
</div>
