<header class="cms-head">
  <div><h1 class="cms-title">Sectores</h1><p class="cms-sub small">Nombre y descripción de cada sector</p></div>
  <div class="cms-head__actions">
    @if (saved()) { <span class="small" style="color:var(--text)">Guardado</span> }
    <button type="button" class="adm-btn" [disabled]="saving()" (click)="save()">{{ saving() ? 'Guardando…' : 'Guardar' }}</button>
  </div>
</header>
@if (error()) { <p class="cms-error">{{ error() }}</p> }
@if (loading()) { <p class="small">Cargando…</p> }
@else {
  <div class="cms-form">
    @for (s of items; track trackById($index, s)) {
      <div class="cms-office">
        <p class="small cms-sub" style="margin:0">{{ s.id }}</p>
        <div class="cms-bi">
          <input class="adm-input" placeholder="Nombre (ES)" [(ngModel)]="s.name.es" />
          <input class="adm-input" placeholder="Name (EN)" [(ngModel)]="s.name.en" />
        </div>
        <div class="cms-bi">
          <textarea class="adm-input" rows="2" placeholder="Descripción (ES)" [(ngModel)]="s.blurb.es"></textarea>
          <textarea class="adm-input" rows="2" placeholder="Blurb (EN)" [(ngModel)]="s.blurb.en"></textarea>
        </div>
      </div>
    }
    <div class="cms-save-bar"><button type="button" class="adm-btn" [disabled]="saving()" (click)="save()">{{ saving() ? 'Guardando…' : 'Guardar sectores' }}</button></div>
  </div>
}
