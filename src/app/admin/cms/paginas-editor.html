<header class="cms-head">
  <div><h1 class="cms-title">Páginas (SEO y encabezados)</h1><p class="cms-sub small">Título y descripción (SEO) + textos del encabezado por página</p></div>
  <div class="cms-head__actions">
    @if (saved()) { <span class="small" style="color:var(--text)">Guardado</span> }
    <button type="button" class="adm-btn" [disabled]="saving()" (click)="save()">{{ saving() ? 'Guardando…' : 'Guardar' }}</button>
  </div>
</header>
@if (error()) { <p class="cms-error">{{ error() }}</p> }
@if (loading()) { <p class="small">Cargando…</p> }
@else {
  <div class="cms-form">
    @for (p of pages; track trackByKey($index, p)) {
      <details class="cms-seo">
        <summary><strong>{{ p.key }}</strong></summary>
        <div style="display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-3)">
          <div class="cms-bi">
            <div class="cms-field"><label>Eyebrow (ES)</label><input class="adm-input" [(ngModel)]="p.meta.eyebrow!.es" /></div>
            <div class="cms-field"><label>Eyebrow (EN)</label><input class="adm-input" [(ngModel)]="p.meta.eyebrow!.en" /></div>
          </div>
          <div class="cms-bi">
            <div class="cms-field"><label>H1 (ES)</label><input class="adm-input" [(ngModel)]="p.meta.h1!.es" /></div>
            <div class="cms-field"><label>H1 (EN)</label><input class="adm-input" [(ngModel)]="p.meta.h1!.en" /></div>
          </div>
          <div class="cms-bi">
            <div class="cms-field"><label>Lead (ES)</label><textarea class="adm-input" rows="2" [(ngModel)]="p.meta.lead!.es"></textarea></div>
            <div class="cms-field"><label>Lead (EN)</label><textarea class="adm-input" rows="2" [(ngModel)]="p.meta.lead!.en"></textarea></div>
          </div>
          <div class="cms-bi">
            <div class="cms-field"><label>Título SEO (ES)</label><input class="adm-input" [(ngModel)]="p.meta.title!.es" /></div>
            <div class="cms-field"><label>SEO title (EN)</label><input class="adm-input" [(ngModel)]="p.meta.title!.en" /></div>
          </div>
          <div class="cms-bi">
            <div class="cms-field"><label>Descripción SEO (ES)</label><textarea class="adm-input" rows="2" [(ngModel)]="p.meta.description!.es"></textarea></div>
            <div class="cms-field"><label>SEO description (EN)</label><textarea class="adm-input" rows="2" [(ngModel)]="p.meta.description!.en"></textarea></div>
          </div>
        </div>
      </details>
    }
    <div class="cms-save-bar"><button type="button" class="adm-btn" [disabled]="saving()" (click)="save()">{{ saving() ? 'Guardando…' : 'Guardar páginas' }}</button></div>
  </div>
}
