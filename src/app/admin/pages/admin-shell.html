<div class="adm">
  <aside class="adm__side">
    <div class="adm__brand">
      <span class="adm__mark" aria-hidden="true"></span>
      <span class="adm__brand-txt">Panel CSD</span>
    </div>

    <nav class="adm__nav">
      <a class="adm__nav-link" routerLink="/admin/notas" routerLinkActive="is-active">
        <span class="adm__dot"></span> Dev notes
      </a>
      <a class="adm__nav-link" routerLink="/admin/leads" routerLinkActive="is-active">
        <span class="adm__dot"></span> Leads
      </a>
      <a class="adm__nav-link" routerLink="/admin/contenido/inicio" routerLinkActive="is-active">
        <span class="adm__dot"></span> Inicio
      </a>
      <a class="adm__nav-link" routerLink="/admin/contenido/proyectos" routerLinkActive="is-active">
        <span class="adm__dot"></span> Proyectos
      </a>
      <a class="adm__nav-link" routerLink="/admin/contenido/clientes" routerLinkActive="is-active">
        <span class="adm__dot"></span> Clientes
      </a>
      <a class="adm__nav-link" routerLink="/admin/contenido/noticias" routerLinkActive="is-active">
        <span class="adm__dot"></span> Noticias
      </a>
      <a class="adm__nav-link" routerLink="/admin/contenido/vacantes" routerLinkActive="is-active">
        <span class="adm__dot"></span> Vacantes
      </a>
      <a class="adm__nav-link" routerLink="/admin/contenido/empresa" routerLinkActive="is-active">
        <span class="adm__dot"></span> Empresa
      </a>
      <a class="adm__nav-link" routerLink="/admin/contenido/etapas" routerLinkActive="is-active">
        <span class="adm__dot"></span> Etapas
      </a>
      <a class="adm__nav-link" routerLink="/admin/contenido/sectores" routerLinkActive="is-active">
        <span class="adm__dot"></span> Sectores
      </a>
      <a class="adm__nav-link" routerLink="/admin/contenido/equipos" routerLinkActive="is-active">
        <span class="adm__dot"></span> Equipos
      </a>
      <a class="adm__nav-link" routerLink="/admin/contenido/paginas" routerLinkActive="is-active">
        <span class="adm__dot"></span> Páginas (SEO)
      </a>
      <a class="adm__nav-link" routerLink="/admin/contenido/biblioteca" routerLinkActive="is-active">
        <span class="adm__dot"></span> Biblioteca
      </a>
      <a class="adm__nav-link" routerLink="/admin/contenido" routerLinkActive="is-active">
        <span class="adm__dot"></span> Export JSON
      </a>
      <a class="adm__nav-link" routerLink="/admin/apariencia" routerLinkActive="is-active">
        <span class="adm__dot"></span> Apariencia
      </a>
    </nav>

    <div class="adm__foot">
      <span class="adm__user" [title]="email() || ''">{{ email() || '—' }}</span>
      <button class="adm-btn adm-btn--ghost" type="button" (click)="logout()">Salir</button>
    </div>
  </aside>

  <main class="adm__main">
    <app-publish-bar />
    <div class="adm__content">
      <router-outlet />
    </div>
  </main>
</div>
