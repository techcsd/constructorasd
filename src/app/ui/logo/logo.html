<span class="app-logo" [class.app-logo--mark-only]="!wordmark()">

  @if (wordmark()) {
    <span class="app-logo__text">
      <span class="app-logo__name">Scheker&nbsp;&amp;&nbsp;Domínguez</span><!-- i18n-allow: brand name -->

    </span>

  <span class="visually-hidden">Constructora Scheker &amp; Domínguez</span><!-- i18n-allow: brand name -->
</span>
