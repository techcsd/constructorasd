<div class="container page-header" appReveal>
  @if (eyebrow()) {
    <app-eyebrow [label]="eyebrow()!" [index]="meta()?.index ?? ''" />
  }
  <h1 class="h1 page-header__title">
    {{ h1parts().before }}@if (h1parts().em) {<em>{{ h1parts().em }}</em>}{{ h1parts().after }}
  </h1>
  @if (lead()) {
    <p class="lead page-header__lead">{{ lead() }}</p>
  }
</div>
