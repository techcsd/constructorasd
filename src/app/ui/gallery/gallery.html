@if (images().length) {
  @let L = layout();
  <ul class="gallery__grid" [class.gallery__grid--fd]="L.fd" [class.gallery__grid--fm]="L.fm">
    @for (img of images().slice(0, L.base); track img.src; let i = $index) {
      <li class="gallery__item" [class.gallery__item--first]="i === 0 && L.fm"
        [class.gallery__item--hide-d]="i >= L.visD" [class.gallery__item--hide-m]="i >= L.visM"
        [class.gallery__item--last-d2]="i === L.base - 1 && L.spanD === 2" [class.gallery__item--last-d3]="i === L.base - 1 && L.spanD === 3"
        [class.gallery__item--last-m2]="i === L.base - 1 && L.spanM === 2">
        <button type="button" class="gallery__thumb" (click)="open(i)"
          [attr.aria-label]="('Ampliar imagen' | t) + ' — ' + img.alt">
          <app-image-figure [image]="img.src" [alt]="img.alt" aspect="4 / 3" [focal]="img.focal"
            [sizes]="i === 0 && L.fm ? '(max-width: 768px) 100vw, 66vw' : '(max-width: 768px) 50vw, 33vw'" />
        </button>
      </li>
    }
  </ul>
  @if (L.hasMore) {
    <p class="gallery__more">
      <button type="button" class="gallery__more-btn" (click)="showAll()">{{ 'Ver todas' | t }} ({{ count() }})</button>
    </p>
  }
}

@if (isOpen()) {
  <div #lightbox class="gallery__lightbox" role="dialog" aria-modal="true"
    [attr.aria-label]="current().alt"
    (keydown)="onLightboxKeydown($event)"
    (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)">
    <button type="button" class="gallery__close" (click)="close()" [attr.aria-label]="'Cerrar' | t">
      <app-icon name="close" [size]="28" />
    </button>
    <button type="button" class="gallery__nav gallery__nav--prev" (click)="prev()"
      [attr.aria-label]="'Anterior' | t"><app-icon name="arrow-right" [size]="28" /></button>

    <figure class="gallery__full">
      <app-image-figure [image]="current().src" [alt]="current().alt" aspect="3 / 2" [priority]="true" [large]="true" sizes="100vw" />
      <figcaption class="small gallery__caption">
        {{ current().alt }} · {{ openIndex() + 1 }} / {{ count() }}
      </figcaption>
    </figure>

    <button type="button" class="gallery__nav gallery__nav--next" (click)="next()"
      [attr.aria-label]="'Siguiente' | t"><app-icon name="arrow-right" [size]="28" /></button>
  </div>
}
