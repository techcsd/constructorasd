@if (entry()) {
  <figure class="app-image-figure" [class.is-armed]="armed()" [class.is-loaded]="loaded()">
    <picture class="app-image-figure__pic" [style.aspect-ratio]="aspect()" [style.background-image]="lqipBg()">
      <source type="image/avif" [attr.srcset]="avifSrcset()" [attr.sizes]="sizes()" />
      <source type="image/webp" [attr.srcset]="webpSrcset()" [attr.sizes]="sizes()" />
      <img
        #img
        [src]="fallbackSrc()"
        [alt]="alt()"
        [style.object-position]="objectPosition()"
        [attr.width]="entry()!.width"
        [attr.height]="entry()!.height"
        [attr.loading]="priority() ? 'eager' : 'lazy'"
        [attr.fetchpriority]="priority() ? 'high' : null"
        [attr.decoding]="priority() ? 'sync' : 'async'"
        (load)="onLoad()"
      />
    </picture>
    @if (caption()) {
      <figcaption class="small app-image-figure__cap">{{ caption() }}</figcaption>
    }
  </figure>
} @else if (directUrl(); as src) {
  <figure class="app-image-figure">
    <picture class="app-image-figure__pic" [style.aspect-ratio]="aspect()">
      <img [src]="src" [alt]="alt()" [style.object-position]="objectPosition()" loading="lazy" />
    </picture>
    @if (caption()) {
      <figcaption class="small app-image-figure__cap">{{ caption() }}</figcaption>
    }
  </figure>
} @else {
  <figure class="app-image-figure">
    <div class="app-image-figure__placeholder" [style.aspect-ratio]="aspect()">
      <span class="small">{{ alt() }}</span>
    </div>
    @if (caption()) {
      <figcaption class="small app-image-figure__cap">{{ caption() }}</figcaption>
    }
  </figure>
}
