@if (routerLink() !== null) {
  <a class="app-project-card" [routerLink]="routerLink()">
    <div class="app-project-card__media">
      <app-image-figure [image]="image()" [alt]="altText()" [aspect]="aspect()" [priority]="priority()" />
    </div>
    <div class="app-project-card__info">
      <h3 class="h3">{{ name() }}</h3>
      @if (meta()) {
        <p class="small app-project-card__meta">{{ meta() }}</p>
      }
    </div>
  </a>
} @else {
  <div class="app-project-card">
    <div class="app-project-card__media">
      <app-image-figure [image]="image()" [alt]="altText()" [aspect]="aspect()" [priority]="priority()" />
    </div>
    <div class="app-project-card__info">
      <h3 class="h3">{{ name() }}</h3>
      @if (meta()) {
        <p class="small app-project-card__meta">{{ meta() }}</p>
      }
    </div>
  </div>
}
