@if (!isAdmin()) {
  <a class="skip-link" href="#main">{{ 'Ir al contenido' | t }}</a>
  @if (isDev) {
    <div class="dev-ribbon" aria-hidden="true">DEV</div>
  }
  <app-header />
}

@if (preview.enabled()) {
  <div class="preview-banner" role="status">
    Vista previa de borrador — así se verá al publicar (no indexado).
    @if (preview.loading()) { <span>· cargando…</span> }
    <a href="/proyectos">Salir de la vista previa</a>
  </div>
}

<main id="main" tabindex="-1">
  <router-outlet />
</main>

@if (!isAdmin()) {
  <app-footer />
  <app-whatsapp-fab />
}
