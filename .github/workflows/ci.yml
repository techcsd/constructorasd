name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build (seedless — no Supabase needed; falls back to TS seeds) + unit tests. The hard gate.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - name: Build (runs every verify-* guard + prerenders all routes)
        run: npm run build
      - name: Unit tests
        run: npm test

  # Lighthouse via the project's script using Playwright's Chromium. Gates a11y/best-practices/SEO = 100
  # (performance is advisory). Reports uploaded as an artifact.
  lighthouse:
    runs-on: ubuntu-latest
    # Informational for now (still runs + uploads scores on every push). Flip to false to make it a hard gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium (for Lighthouse)
        run: npx playwright install chromium
      - name: Lighthouse budgets
        run: npm run lighthouse
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse/
          if-no-files-found: ignore

  # Did the repo get Supabase dev secrets? If so, the full e2e suite can run against a real backend.
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_supabase: ${{ steps.c.outputs.has }}
    steps:
      - id: c
        run: echo "has=${{ secrets.SUPABASE_ANON_KEY_DEV != '' }}" >> "$GITHUB_OUTPUT"

  # Public e2e (and admin, if QA creds are present). Only runs when the dev Supabase secrets exist, so the
  # default CI stays green without any secret setup. Add repo secrets to enable:
  #   SUPABASE_URL_DEV, SUPABASE_ANON_KEY_DEV  (public site)   ·  QA_ADMIN_EMAIL, QA_ADMIN_PASSWORD (admin)
  e2e:
    needs: check-secrets
    if: needs.check-secrets.outputs.has_supabase == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_DEV }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_DEV }}
      MAPS_EMBED_KEY: ${{ secrets.MAPS_EMBED_KEY }}
      QA_ADMIN_EMAIL: ${{ secrets.QA_ADMIN_EMAIL }}
      QA_ADMIN_PASSWORD: ${{ secrets.QA_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Playwright (Chromium)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
